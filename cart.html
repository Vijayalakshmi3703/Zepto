<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>
    <link rel="stylesheet" href="./cart.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav>
            <span><a href="http://127.0.0.1:5501/Zepto/index.html"> < </a> </span>
            <h2>Cart</h2>
        </nav>
        <div class="cart">
            <div class="head">
                <span><i class="fa-solid fa-clock-rotate-left"></i></span>
                <div>
                    <h3>Delivering in 6 minutes</h3>
                    <p class="text-secondary">3 items</p>
                </div>
            </div>
            <div class="box">
                <img src="./images/diarymilk.jpg" alt="">
                <div class="left">
                    <p>Cadbury Dairy Milk Silk Bubbly Milk Chocolate Bar</p>
                    <p>1 pack (200g)</p>
                </div>
                <div>
                    <button class="bt"><span class="text-danger">-</span>1<span class="text-danger">+</span></button>
                    <h6><del class="text-secondary m-2">190</del><span class="text-success">165</span></h6>
                </div>
            </div>
            <div class="box">
                <img src="./images/fanta.avif" alt="">
                <div class="left">
                    <p>Fanta Soft Drink Orange Flavoured</p>
                    <p>1 lr</p>
                </div>
                <div>
                    <button class="bt"><span class="text-danger">-</span>2<span class="text-danger">+</span></button>
                    <h6><del class="text-secondary m-2">80</del><span class="text-success">42</span></h6>
                </div>
            </div>
            <div class="box">
                <img src="./images/maggipocket.webp" alt="">
                <div class="left">
                    <p>Maggi 2-minute Noodles Mini Pocket</p>
                    <p>1 pack (250g)</p>
                </div>
                <div>
                    <button class="bt"><span class="text-danger">-</span>1<span class="text-danger">+</span></button>
                    <h6><del class="text-secondary m-2">40</del><span class="text-success">22</span></h3>
                </div>
            </div>
            <div class="end">
                <b>Forgot something?<b class="text-danger">Add More Items</b></b>
            </div>
        </div>
        <div class="button">
            <a href="http://127.0.0.1:5501/Zepto/address.html"><button>Login to Proceed</button></a>
        </div>     
    </div>
</body>
</html>
